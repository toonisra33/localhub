name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Install Project Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Initialize & Build TWA Android Project
        run: |
          mkdir -p android-build
          cd android-build

          keytool -genkey -v -keystore android.keystore -alias localhub -keyalg RSA -keysize 2048 -validity 10000 -storepass localhub123456 -keypass localhub123456 -dname "CN=Toon Isra, OU=LocalHub, O=LocalHub, L=Bangkok, ST=Bangkok, C=TH"

          bubblewrap init --manifest=https://localhub-69fbe.web.app/manifest.json --skipPwaValidation

          bubblewrap build --skipPwaValidation --signing.keyPath=./android.keystore --signing.keyPassword=localhub123456 --signing.keyAlias=localhub --signing.storePassword=localhub123456

      - name: Upload Android App Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Android-Bundle-aab
          path: |
            android-build/*.aab
            android-build/*.apk
            android-build/android.keystore
