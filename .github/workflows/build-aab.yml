name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Install Project Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Initialize & Build TWA Android Project
        run: |
          mkdir -p android-build
          cd android-build

          # 1. Initialize project non-interactively
          yes "" | bubblewrap init --manifest=https://localhub-69fbe.web.app/manifest.json --skipPwaValidation || true

          # 2. Build Release Bundle (.AAB) directly with gradle
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew bundleRelease assembleRelease
          else
            bubblewrap build --skipPwaValidation --keyStorePath=android.keystore --keyStorePassword=localhub123456 --keyName=android --keyPassword=localhub123456
          fi

      - name: Upload Android App Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Android-Bundle-aab
          path: |
            android-build/**/*.aab
            android-build/**/*.apk
            android-build/*.keystore
