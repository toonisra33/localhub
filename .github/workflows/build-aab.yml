name: Build Android App Bundle (AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Install Project Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Initialize & Build TWA Android Project
        run: |
          mkdir -p android-build
          cd android-build

          # Create KeyStore beforehand
          keytool -genkey -v -keystore android.keystore -alias localhub -keyalg RSA -keysize 2048 -validity 10000 -storepass localhub123456 -keypass localhub123456 -dname "CN=Toon Isra, OU=LocalHub, O=LocalHub, L=Bangkok, ST=Bangkok, C=TH"

          # Create twa-manifest.json directly so bubblewrap does not ask any questions
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.toon.localhub",
            "host": "localhub-69fbe.web.app",
            "name": "LocalHub",
            "launcherName": "LocalHub",
            "themeColor": "#10B981",
            "themeColorDark": "#111827",
            "navigationColor": "#111827",
            "navigationColorDark": "#111827",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#111827",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/toonisra33/localhub/main/public/icon-512.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/toonisra33/localhub/main/public/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "localhub"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://localhub-69fbe.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "locationDelegation": {
                "enabled": true
              },
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "fullScopeUrl": "https://localhub-69fbe.web.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": []
          }
          EOF

          # Generate Gradle project from manifest
          bubblewrap update --skipPwaValidation

          # Compile AAB Bundle with Gradle
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Upload Android App Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalHub-Android-Bundle-aab
          path: |
            android-build/app/build/outputs/bundle/release/*.aab
            android-build/app/build/outputs/apk/release/*.apk
            android-build/android.keystore
